<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f"><title>오늘 몇 kg</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><h1 data-h="title"></h1><div class="tg"><div class="seg" id="langChips"><button data-l="ko">한</button><button data-l="en">EN</button></div><div class="seg" id="unitChips"><button data-u="kg">kg</button><button data-u="lb">lb</button></div><button class="gear" id="gearBtn" aria-label="settings">⚙</button></div></header>
<div id="gearMenu" class="gearmenu" hidden><b data-i="data"></b><p class="muted" data-i="dataNote"></p><button class="btn" id="exp" data-i="exp"></button><button class="btn" id="csv" data-i="csv"></button><button class="btn" id="imp" data-i="imp"></button><input type="file" id="impF" accept=".json,application/json" hidden><button class="btn" id="wipe" data-i="wipe"></button><button class="btn" id="tourAgain" data-i="tourAgain"></button><div class="muted" id="today" style="margin-top:8px"></div></div>
<section id="t-log" class="on">
 <h2 class="ttl" data-i="hLog"></h2><p class="guide" data-i="gLog"></p>
 <div class="banner" id="bk" hidden><span data-i="bkDue"></span><button class="chip" id="bkNow" data-i="bkNow"></button></div>
 <button class="banner mini" id="mini" hidden></button>
 <div class="card"><label data-i="ex"></label><select id="exSel"></select><div id="sug" class="sug"></div><label data-i="note"></label><input id="note" maxlength="140"></div>
 <div class="card"><div class="banner ed" id="edBar" hidden><span id="edTxt"></span><button class="chip" id="edCancel" data-i="cancel"></button></div><div class="row dt"><label data-i="dateL"></label><input id="dt" type="date"></div><label id="wLbl"></label>
  <div class="step"><button class="sb" data-st="w" data-d="-1" aria-label="-">−</button><input id="w" class="bigin" type="number" inputmode="decimal" step="0.5"><button class="sb" data-st="w" data-d="1" aria-label="+">+</button></div>
  <div id="sets"></div><p class="muted hint" data-i="doneHint"></p>
  <div class="row2"><button class="btn g" id="addSet" data-i="addSet"></button><button class="btn g" id="allDone" data-i="allDone"></button></div><div class="row2"><button class="btn g" id="same" data-i="same"></button><button class="btn g" id="restBtn" data-i="rest"></button></div></div>
 <div class="dock"><button class="btn p" id="save" data-i="save"></button></div>
 <div class="card share" id="shareBar" hidden><span id="shareLbl"></span><button class="btn p sm" id="shareBtn" data-i="shBtn"></button></div>
 <div class="card"><b data-i="e1rm"></b><button class="q" data-q="e1rm">?</button> <span class="muted" data-i="epley"></span><canvas id="chart" width="600" height="300"></canvas><div id="hist"></div></div>
 <details class="card muted" style="font-size:13px"><summary data-i="ruleH"></summary><div id="rules"></div><div style="margin-top:8px"><button class="q" data-q="prog">?</button> <span data-i="qProgL"></span> <button class="q" data-q="deload">?</button> <span data-i="qDeloadL"></span></div></details>
</section>
<section id="t-plate">
 <h2 class="ttl" data-i="hPlate"></h2><p class="guide" data-i="gPlate"></p>
 <div class="card"><label id="ptLbl" class="biglbl"></label>
 <div class="step"><button class="sb" data-st="pt" data-d="-1" aria-label="-">−</button><input id="pt" class="bigin" type="number" inputmode="decimal" step="0.5"><button class="sb" data-st="pt" data-d="1" aria-label="+">+</button></div>
 <div class="chips quick" id="qChips"></div>
 <label data-i="bar"></label><div class="chips" id="barChips"></div>
 <div id="pbWrap" hidden><label id="pbLbl"></label><input id="pb" type="number" inputmode="decimal" step="0.5"></div></div>
 <div class="card res"><div id="pres"></div><div class="bar" id="barViz"></div></div>
 <details class="card" id="wuBox"><summary><span data-i="wu"></span> <button class="q" data-q="wu">?</button></summary><p class="muted" data-i="wuNote"></p><div id="wu"></div></details>
 <details class="card"><summary data-i="plates"></summary><div class="chips" id="plChips" style="margin-top:10px"></div>
 <div class="row" style="margin-top:8px"><input id="newPl" type="number" inputmode="decimal"><button class="btn g" id="addPl" style="flex:0;margin:0;min-width:84px" data-i="add"></button></div></details>
</section>
<section id="t-rest">
 <h2 class="ttl" data-i="hRest"></h2><p class="guide" data-i="gRest"></p>
 <div class="card"><div class="muted ctr" id="rFor"></div><div class="timer" id="tm">0:00</div>
 <div class="row2"><button class="btn g" id="tMinus">−15s</button><button class="btn g" id="tPlus">+15s</button></div>
 <button class="btn p xl" id="tStart" data-i="start"></button><button class="btn" id="tStop" data-i="stop"></button></div>
 <div class="card"><b data-i="rSetH"></b><label data-i="rEx"></label><select id="rEx"></select><label data-i="rSec"></label><input id="rSec" type="number" inputmode="numeric">
 <div class="chips" style="margin-top:8px"><button class="chip" data-s="60" data-i="s60"></button><button class="chip" data-s="90" data-i="s90"></button><button class="chip" data-s="120" data-i="s120"></button><button class="chip" data-s="180" data-i="s180"></button></div>
 <p class="muted" data-i="restNote"></p></div>
</section>
<section id="t-rt">
 <h2 class="ttl" data-i="hRt"></h2><p class="guide" data-i="gRt"></p>
 <div class="card"><b data-i="tplH"></b><p class="muted" data-i="tplNote"></p><div id="tpl"></div></div>
 <div class="card"><b data-i="orDiy"></b><label class="stp" data-i="time"></label><div class="chips" id="minChips"></div><label class="stp" data-i="parts"></label><div class="chips" id="partChips"></div>
 <button class="btn p" id="gen" data-i="gen"></button></div>
 <div class="card" id="rtOut"></div>
</section>
<nav id="nav" style="grid-template-columns:repeat(4,1fr)"><button data-t="t-log" class="on"><span>📈</span><i data-i="nLog"></i></button><button data-t="t-plate"><span>🏋️</span><i data-i="nPlate"></i></button><button data-t="t-rest"><span>⏱</span><i data-i="nRest"></i></button><button data-t="t-rt"><span>📋</span><i data-i="nRt"></i></button></nav>
<div id="tip" class="tip" hidden><p id="tipTx"></p><button class="btn p" id="tipX" data-i="tipClose"></button></div><div id="tour" class="tourbg" hidden><div class="tourc"><div class="dots" id="tDots"></div><h3 id="tT"></h3><p id="tB"></p><div class="row2"><button class="btn g" id="tSkip" data-i="tourSkip"></button><button class="btn p" id="tNext"></button></div></div></div>
<div id="shSheet" class="sheetbg" hidden><div class="sheet"><b data-i="shTitle"></b><p class="shtxt" id="shTxt"></p><img id="shImg" alt="story"><div class="row2"><button class="btn g" id="shCopy" data-i="shCopy"></button><button class="btn p" id="shImgBtn" data-i="shImg"></button></div><button class="btn" id="shX" data-i="shClose"></button></div></div>
<p id="vis" class="vis" hidden></p><div id="toast" class="toast" hidden></div><script src="logic.js"></script><script src="i18n.js"></script><script src="app.js"></script></body></html>
